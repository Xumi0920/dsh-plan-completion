- insert:
    - id: plan-completion
      name: 'dsh-plan-completion'
      config:
        evidenceChars: 1500
        maxTokensPatch: 400
        maxTokensRewrite: 1200
        warmBackfill: true
        modelCalls: true # false: heuristic-only; no plugin model requests
        # Debug endpoints (debug/diag/theme/experiment/autojob/steps/reset) stay off in production.
        enableDebugRoutes: false
        # Optional: set a local directory to persist debug logs / experiment data.
        # debugDir: '<local debug directory>'
